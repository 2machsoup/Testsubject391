services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    volumes:
      - server-data:/app/data

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  server-data:
