<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WoW Log Analyzer{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #14161c;
      --panel: #1c1f27;
      --border: #2c3040;
      --text: #e8e9ee;
      --muted: #9aa0b0;
      --accent: #6ea8fe;
      --major: #ff6b6b;
      --minor: #ffce54;
      --info: #6ea8fe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.25rem;
    }
    p.subtitle {
      color: var(--muted);
      margin-top: 0;
      margin-bottom: 1.5rem;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
      margin-top: 0.9rem;
    }
    label:first-of-type { margin-top: 0; }
    input, select {
      width: 100%;
      padding: 0.5rem 0.6rem;
      background: #10121a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }
    fieldset {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 1.25rem;
      padding: 0.25rem 0.9rem 0.9rem;
    }
    legend {
      color: var(--muted);
      padding: 0 0.4rem;
      font-size: 0.85rem;
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.65rem;
      background: var(--accent);
      color: #0a1120;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    a { color: var(--accent); }
    .error {
      background: #3a1c1c;
      border: 1px solid var(--major);
      color: #ffb3b3;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
    }
    .category-header {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 1.5rem 0 0.5rem;
    }
    .finding {
      border-left: 3px solid var(--info);
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.6rem;
      background: #10121a;
      border-radius: 0 6px 6px 0;
    }
    .finding.major { border-left-color: var(--major); }
    .finding.minor { border-left-color: var(--minor); }
    .finding.info { border-left-color: var(--info); }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      margin-right: 0.5rem;
    }
    .badge.major { background: var(--major); color: #2a0000; }
    .badge.minor { background: var(--minor); color: #2a2000; }
    .badge.info { background: var(--info); color: #001a3a; }
    .detail {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
