services:
  - type: web
    name: sales-dashboard-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter # persistent disks require Starter or above, not the free plan
    healthCheckPath: /api/health
    disk:
      name: sales-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        value: https://sales-dashboard-client.onrender.com # update if Render assigns a different subdomain
      - key: SERVER_BASE_URL
        value: https://sales-dashboard-api.onrender.com # update if Render assigns a different subdomain
      - key: SESSION_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ETSY_KEYSTRING
        sync: false
      - key: ETSY_SHARED_SECRET
        sync: false
      - key: ETSY_REDIRECT_URI
        value: https://sales-dashboard-api.onrender.com/api/auth/etsy/callback
      - key: SQUARE_APPLICATION_ID
        sync: false
      - key: SQUARE_APPLICATION_SECRET
        sync: false
      - key: SQUARE_ENVIRONMENT
        value: production
      - key: SQUARE_REDIRECT_URI
        value: https://sales-dashboard-api.onrender.com/api/auth/square/callback
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_SCOPES
        value: read_orders,read_products
      - key: SHOPIFY_REDIRECT_URI
        value: https://sales-dashboard-api.onrender.com/api/auth/shopify/callback

  - type: web
    name: sales-dashboard-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sales-dashboard-api.onrender.com # update if Render assigns a different subdomain
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
