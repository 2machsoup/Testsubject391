services:
  - type: web
    name: sales-dashboard-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    # No persistent disk on the free plan: the SQLite database (connected
    # accounts, imported CSV data) is wiped every time this service restarts
    # or spins down from being idle. Add a `disk:` block back (and bump
    # `plan` to at least `starter`) once you need data to actually persist.
    envVars:
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        value: https://sales-dashboard-client-0mht.onrender.com
      - key: SERVER_BASE_URL
        value: https://sales-dashboard-api-nvi9.onrender.com
      - key: SESSION_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ETSY_KEYSTRING
        sync: false
      - key: ETSY_SHARED_SECRET
        sync: false
      - key: ETSY_REDIRECT_URI
        value: https://sales-dashboard-api-nvi9.onrender.com/api/auth/etsy/callback
      - key: SQUARE_APPLICATION_ID
        sync: false
      - key: SQUARE_APPLICATION_SECRET
        sync: false
      - key: SQUARE_ENVIRONMENT
        value: production
      - key: SQUARE_REDIRECT_URI
        value: https://sales-dashboard-api-nvi9.onrender.com/api/auth/square/callback
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_SCOPES
        value: read_orders,read_products
      - key: SHOPIFY_REDIRECT_URI
        value: https://sales-dashboard-api-nvi9.onrender.com/api/auth/shopify/callback

  - type: web
    name: sales-dashboard-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sales-dashboard-api-nvi9.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
